name: Validar KPI territorial do Relatório Integrado

on:
  push:
    paths:
      - 'pages/7_Relatorios_Integrados.py'
      - 'tests/test_relatorio_integrado_kpi_territorial.py'
      - '.github/workflows/validar-relatorio-kpi-territorial.yml'
  pull_request:
    paths:
      - 'pages/7_Relatorios_Integrados.py'
      - 'tests/test_relatorio_integrado_kpi_territorial.py'
      - '.github/workflows/validar-relatorio-kpi-territorial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar pandas para testes isolados
        run: python -m pip install 'pandas>=2.0,<3.0'
      - name: Validar sintaxe do módulo e dos testes
        run: python -m py_compile pages/7_Relatorios_Integrados.py tests/test_relatorio_integrado_kpi_territorial.py
      - name: Testar contagem THE TIM API e integração PDF/CSV
        run: python -m unittest discover -s tests -p 'test_relatorio_integrado_kpi_territorial.py' -v
