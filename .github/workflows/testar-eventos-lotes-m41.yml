name: Validar consolidacao de Eventos no Gerador de Lotes M4.1

on:
  push:
    paths:
      - 'gerador_lotes/ferramentas/eventos.py'
      - 'tests/test_gerador_lotes_eventos_agrupamento.py'
      - '.github/workflows/testar-eventos-lotes-m41.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencia dos testes
        run: python -m pip install 'pandas>=2.2,<3'
      - name: Verificar sintaxe
        run: python -m py_compile gerador_lotes/ferramentas/eventos.py
      - name: Verificar lote unico de quatro bairros e regressões
        run: python -m unittest discover -s tests -p 'test_gerador_lotes_eventos_agrupamento.py' -v
