name: Testar vinculos territoriais do Farol

on:
  push:
    paths:
      - 'pages/3_Farol_Operacional.py'
      - 'tests/test_farol_territorial_hibrido.py'
      - 'tests/test_farol_responsavel_atualizacao.py'
      - '.github/workflows/testar-vinculo-territorial-farol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de testes
        run: python -m pip install 'pandas>=2.2,<3'
      - name: Verificar sintaxe do Modulo 3
        run: python -m py_compile pages/3_Farol_Operacional.py
      - name: Testar importacao, subareas, enderecos e janela temporal
        run: python -m unittest discover -s tests -p 'test_farol_territorial_hibrido.py' -v
      - name: Testar usuario da ultima atualizacao e legado do Google Sheets
        run: python -m unittest discover -s tests -p 'test_farol_responsavel_atualizacao.py' -v
