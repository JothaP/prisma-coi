name: Validar agrupamento de marcadores do Modulo 1

on:
  push:
    paths:
      - "pages/1_Baixa_Pressao.py"
      - "bp_agrupamento_marcadores.py"
      - "tests/test_bp_agrupamento_marcadores.py"
      - ".github/workflows/testar-clusters-baixa-pressao.yml"
  pull_request:
    paths:
      - "pages/1_Baixa_Pressao.py"
      - "bp_agrupamento_marcadores.py"
      - "tests/test_bp_agrupamento_marcadores.py"
      - ".github/workflows/testar-clusters-baixa-pressao.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar biblioteca de mapa
        run: python -m pip install "folium==0.20.0"
      - name: Verificar sintaxe sem abrir o Streamlit
        run: python -m py_compile pages/1_Baixa_Pressao.py bp_agrupamento_marcadores.py
      - name: Validar faixas, JS gerado, zoom e regressao de filtros
        run: python -m unittest discover -s tests -p "test_bp_agrupamento_marcadores.py" -v
