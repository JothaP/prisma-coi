name: PRISMA - Testes da auditoria de limpeza

on:
  pull_request:
    paths:
      - 'scripts/auditar_limpeza_pressoes.py'
      - 'tests/test_auditar_limpeza_pressoes.py'
      - '.github/workflows/auditar_limpeza_pressao.yml'
      - '.github/workflows/testes_auditoria_limpeza_pressoes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install openpyxl
      - name: Validar sintaxe
        run: |
          python -m py_compile scripts/auditar_limpeza_pressoes.py scripts/arquivar_historico_pressao.py scripts/arquivar_historico_pressao_modulo2.py
      - name: Executar testes sem credenciais
        run: python -m unittest discover -s tests -p 'test_auditar_limpeza_pressoes.py' -v
