name: Validar Central de Atualização de Bases

on:
  push:
    paths:
      - 'app.py'
      - 'pages/13_Atualizacao_de_Bases.py'
      - 'prisma_atualizacoes_backend.py'
      - 'sql/prisma_central_atualizacoes_bases.sql'
      - 'tests/test_central_atualizacoes_bases.py'
      - '.github/workflows/validar-central-atualizacoes-bases.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'pages/13_Atualizacao_de_Bases.py'
      - 'prisma_atualizacoes_backend.py'
      - 'sql/prisma_central_atualizacoes_bases.sql'
      - 'tests/test_central_atualizacoes_bases.py'
      - '.github/workflows/validar-central-atualizacoes-bases.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências dos testes isolados
        run: python -m pip install 'pandas>=2.2,<3' 'openpyxl>=3.1,<4'
      - name: Verificar sintaxe dos módulos
        run: python -m py_compile app.py pages/13_Atualizacao_de_Bases.py prisma_atualizacoes_backend.py tests/test_central_atualizacoes_bases.py
      - name: Verificar segurança e operações simuladas
        run: python -m unittest discover -s tests -p 'test_central_atualizacoes_bases.py' -v
