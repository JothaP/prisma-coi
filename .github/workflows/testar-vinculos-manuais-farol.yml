name: Validar vínculos manuais de O.S. no Farol
on:
  push:
    paths:
      - 'farol_vinculos_os_manuais.py'
      - 'pages/3_Farol_Operacional.py'
      - 'pages/7_Relatorios_Integrados.py'
      - 'tests/test_farol_vinculos_os_manuais.py'
      - 'sql/farol_vinculos_os_manuais_20261113.sql'
      - '.github/workflows/testar-vinculos-manuais-farol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias do teste
        run: python -m pip install 'pandas>=2.2,<3'
      - name: Verificar sintaxe do modulo e do backend
        run: |
          python -m py_compile farol_vinculos_os_manuais.py pages/3_Farol_Operacional.py pages/7_Relatorios_Integrados.py
      - name: Testar vinculos manuais e integracao entre modulos
        run: python -m unittest discover -s tests -p 'test_farol_vinculos_os_manuais.py' -v
