name: PRISMA - Auditoria de limpeza de pressões (somente leitura)

on:
  workflow_dispatch:
    inputs:
      modulo:
        description: 'Selecione o módulo'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
      competencias:
        description: 'Competências AAAA-MM separadas por vírgula'
        required: true
        default: '2026-09,2026-10'
        type: string

permissions:
  contents: read

concurrency:
  group: prisma-auditoria-limpeza-pressoes
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sync-pressao.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-sync-pressao.txt
      - name: Testes de conciliação sem credenciais
        run: python -m unittest discover -s tests -p 'test_auditar_limpeza_pressoes.py' -v
      - name: Comparar planilha e histórico sem alterar dados
        env:
          MODULO: ${{ inputs.modulo }}
          COMPETENCIAS: ${{ inputs.competencias }}
          SAI_GCP_JSON: ${{ secrets.SAI_GCP_JSON }}
          SAI_SHEET_ID: ${{ secrets.SAI_SHEET_ID }}
          PRISMA_HISTORICO_M2_SHEET_ID: ${{ vars.PRISMA_HISTORICO_M2_SHEET_ID }}
          PRISMA_HISTORICO_SUPABASE_SECRET_KEY: ${{ secrets.PRISMA_HISTORICO_SUPABASE_SECRET_KEY }}
          PRISMA_HISTORICO_SUPABASE_URL: ${{ vars.PRISMA_HISTORICO_SUPABASE_URL }}
          PRISMA_HISTORICO_BUCKET: ${{ vars.PRISMA_HISTORICO_BUCKET }}
        run: python scripts/auditar_limpeza_pressoes.py --modulo "$MODULO" --competencias "$COMPETENCIAS"
