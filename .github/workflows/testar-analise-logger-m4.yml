name: Testar Analise de Logger Modulo 4

on:
  push:
    paths:
      - "logger_regionais.py"
      - "logger_monitor_core.py"
      - "logger_comportamento_core.py"
      - "pages/4_4_Analise_de_Logger.py"
      - "pages/4_Ferramentas_Operacionais.py"
      - "tests/test_analise_logger_m4.py"
      - "tests/test_monitor_logger_incremental_m4.py"
      - "logger_xlsx_fallback.py"
      - ".github/workflows/testar-analise-logger-m4.yml"
  pull_request:
    paths:
      - "logger_regionais.py"
      - "logger_monitor_core.py"
      - "logger_comportamento_core.py"
      - "pages/4_4_Analise_de_Logger.py"
      - "pages/4_Ferramentas_Operacionais.py"
      - "tests/test_analise_logger_m4.py"
      - "tests/test_monitor_logger_incremental_m4.py"
      - "logger_xlsx_fallback.py"
      - ".github/workflows/testar-analise-logger-m4.yml"

permissions:
  contents: read

jobs:
  logger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias dos testes
        run: python -m pip install "pandas>=2.2,<3" numpy openpyxl xlrd
      - name: Verificar sintaxe de todos os arquivos
        run: |
          python -m py_compile logger_regionais.py logger_monitor_core.py logger_xlsx_fallback.py logger_comportamento_core.py pages/4_4_Analise_de_Logger.py pages/4_Ferramentas_Operacionais.py
      - name: Testar monitor e analisador sem acessar bases reais
        run: python -m unittest discover -s tests -p "test_analise_logger_m4.py" -v
      - name: Testar uploads acumulativos e falha de Excel Infinity
        run: python -m unittest discover -s tests -p "test_monitor_logger_incremental_m4.py" -v
