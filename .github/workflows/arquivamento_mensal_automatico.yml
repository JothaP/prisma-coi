name: PRISMA - Arquivamento Mensal Automático (Módulos 1 e 2)

on:
  schedule:
    # Dia 2, 09h17, horario de Sao Paulo (sem executar no inicio da hora).
    - cron: '17 9 2 * *'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:
    inputs:
      competencia:
        description: 'Competencia AAAA-MM; vazio = mes anterior em Sao Paulo'
        required: false
        type: string
      modo:
        description: 'Execucao manual em simulacao por padrao'
        required: true
        default: simular
        type: choice
        options:
          - simular
          - arquivar

permissions:
  contents: read

# Mesmo grupo dos workflows manuais para evitar concorrencia entre operacoes
# de arquivamento. A importacao operacional usa outro grupo e nao e alterada.
concurrency:
  group: prisma-arquivamento-pressao-mensal
  cancel-in-progress: false

jobs:
  arquivar:
    name: Arquivar modulo ${{ matrix.modulo }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - modulo: '1'
            script: 'scripts/arquivar_historico_pressao.py'
          - modulo: '2'
            script: 'scripts/arquivar_historico_pressao_modulo2.py'

    steps:
      - name: Baixar codigo do PRISMA
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sync-pressao.txt

      - name: Instalar dependencias do arquivador
        run: python -m pip install -r requirements-sync-pressao.txt

      - name: Validar parser de dados legados do Modulo 2
        if: matrix.modulo == '2'
        run: python -m unittest discover -s tests -p 'test_arquivar_modulo2.py' -v

      - name: Simular ou arquivar historico mensal
        env:
          COMPETENCIA: ${{ inputs.competencia }}
          MODO: ${{ github.event_name == 'schedule' && 'arquivar' || inputs.modo }}
          SCRIPT: ${{ matrix.script }}
          SAI_GCP_JSON: ${{ secrets.SAI_GCP_JSON }}
          SAI_SHEET_ID: ${{ secrets.SAI_SHEET_ID }}
          PRISMA_HISTORICO_M2_SHEET_ID: ${{ vars.PRISMA_HISTORICO_M2_SHEET_ID }}
          PRISMA_HISTORICO_SUPABASE_SECRET_KEY: ${{ secrets.PRISMA_HISTORICO_SUPABASE_SECRET_KEY }}
          PRISMA_HISTORICO_SUPABASE_URL: ${{ vars.PRISMA_HISTORICO_SUPABASE_URL }}
          PRISMA_HISTORICO_BUCKET: ${{ vars.PRISMA_HISTORICO_BUCKET }}
        run: |
          python "$SCRIPT" --competencia "$COMPETENCIA" --modo "$MODO"
